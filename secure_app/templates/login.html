{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<form method="post" action="{{ url_for('auth.login') }}" class="card">
  <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
  <label for="email">Email address</label>
  <input type="email" id="email" name="email" maxlength="254" required autocomplete="username">
  <label for="password">Password</label>
  <input type="password" id="password" name="password" minlength="12" maxlength="128" required autocomplete="current-password">
  <button type="submit">Sign in</button>
</form>
{% endblock %}
