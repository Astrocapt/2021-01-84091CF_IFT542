{% extends "base.html" %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<h1>Edit profile</h1>
<form method="post" action="{{ url_for('main.profile') }}" class="card">
  <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
  <label for="department">Department</label>
  <input type="text" id="department" name="department" maxlength="80" value="{{ profile['department'] if profile else '' }}">
  <label for="level">Level</label>
  <input type="text" id="level" name="level" maxlength="10" value="{{ profile['level'] if profile else '' }}">
  <label for="phone">Phone</label>
  <input type="text" id="phone" name="phone" maxlength="24" value="{{ profile['phone'] if profile else '' }}">
  <label for="bio">Bio</label>
  <textarea id="bio" name="bio" maxlength="500" rows="4">{{ profile['bio'] if profile else '' }}</textarea>
  <button type="submit">Save profile</button>
</form>
{% endblock %}
