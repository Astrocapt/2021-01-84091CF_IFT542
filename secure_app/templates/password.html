{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<h1>Change password</h1>
<form method="post" action="{{ url_for('auth.change_password') }}" class="card">
  <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
  <label for="current_password">Current password</label>
  <input type="password" id="current_password" name="current_password" required autocomplete="current-password">
  <label for="new_password">New password (minimum 12 characters)</label>
  <input type="password" id="new_password" name="new_password" minlength="12" maxlength="128" required autocomplete="new-password">
  <label for="confirm_password">Confirm new password</label>
  <input type="password" id="confirm_password" name="confirm_password" minlength="12" maxlength="128" required autocomplete="new-password">
  <button type="submit">Update password</button>
</form>
{% endblock %}
